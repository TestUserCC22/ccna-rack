<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCNA Rack</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Offline study app for the Cisco CCNA 200-301 v2.0 exam">
<meta name="theme-color" content="#0b1214">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CCNA Rack">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Public+Sans:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: phone-first single column under a rack faceplate; a bottom tab bar; mono for anything counted or typed into IOS. */
:root{
  --bg:#e8ecec; --panel:#f8f9f9; --ink:#132024; --muted:#55676d; --line:#c9d2d4;
  --accent:#0f6e7c; --accent-ink:#ffffff; --accent-soft:#d5e7ea;
  --chassis:#1d4f5a; --chassis-2:#173f48; --chassis-ink:#d7eef0; --socket:#07181c;
  --led-amber:#ffb224; --led-green:#35e088;
  --good:#1c7a4c; --warn:#9a5b00; --bad:#b3362b;
  --display:"Saira Condensed","Arial Narrow",sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1214; --panel:#121c1f; --ink:#dfe9ea; --muted:#8fa3a8; --line:#243439;
    --accent:#62c9d6; --accent-ink:#06262b; --accent-soft:#15343a;
    --chassis:#1a4651; --chassis-2:#143841;
    --good:#5fd093; --warn:#e6aa4c; --bad:#f08a7e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1214; --panel:#121c1f; --ink:#dfe9ea; --muted:#8fa3a8; --line:#243439;
  --accent:#62c9d6; --accent-ink:#06262b; --accent-soft:#15343a;
  --chassis:#1a4651; --chassis-2:#143841;
  --good:#5fd093; --warn:#e6aa4c; --bad:#f08a7e; color-scheme:dark;
}
:root[data-skin="graphite"]{--chassis:#3b4248;--chassis-2:#2c3237}
:root[data-skin="cobalt"]{--chassis:#21468a;--chassis-2:#19376e}
:root[data-skin="oxblood"]{--chassis:#6c2732;--chassis-2:#561e27}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;background-attachment:fixed;background-position:-1px -1px}
body::before{content:"";position:fixed;inset:0;background:var(--bg);opacity:.72;pointer-events:none;z-index:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.silk{font:600 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.app{position:relative;z-index:1;max-width:680px;margin:0 auto;min-height:100%;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{white-space:nowrap;font:700 22px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.brand small{display:block;font:400 11px/1.3 var(--mono);letter-spacing:0;text-transform:none;color:var(--muted);margin-top:4px}
.chips{display:flex;gap:6px;align-items:center}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--mono);padding:7px 9px;border-radius:4px;border:1px solid var(--line);background:var(--panel);text-decoration:none;color:var(--ink);cursor:pointer}
.chip.timer{border-color:var(--led-amber);color:var(--warn)}
#view{display:flex;flex-direction:column;gap:14px}
nav.tabs{position:fixed;z-index:30;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs a{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:6px;text-decoration:none;color:var(--muted);font:600 11px/1 var(--display);letter-spacing:.12em;text-transform:uppercase}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
nav.tabs a b{font:500 10px/1 var(--mono);letter-spacing:0;background:var(--bad);color:#fff;border-radius:8px;padding:2px 5px;position:absolute;transform:translate(14px,-4px)}
/* faceplate */
.plate{position:relative;overflow:hidden;background:linear-gradient(var(--chassis),var(--chassis-2));color:var(--chassis-ink);border-radius:8px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 1px 0 #ffffff22,inset 0 -2px 0 #00000040}
.plate .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.plate h1{font:700 19px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;margin:0}
.plate h1 span{font-weight:500;opacity:.75}
.leds{display:flex;gap:12px}
.led{display:flex;align-items:center;gap:6px;font:600 10px/1 var(--display);letter-spacing:.14em}
.led i{display:block;width:8px;height:8px;border-radius:50%;background:#0a2a30}
.led.on i{background:var(--led-green);box-shadow:0 0 7px var(--led-green)}
.led.wait i{background:var(--led-amber);box-shadow:0 0 7px var(--led-amber)}
.groups{display:flex;gap:12px 18px;flex-wrap:wrap}
.group{display:flex;flex-direction:column;gap:6px}
.group .ports{display:flex;gap:4px;flex-wrap:wrap}
.group .cap{display:flex;justify-content:space-between;gap:10px;font:600 10px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.port{width:30px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;cursor:pointer;color:var(--chassis-ink)}
.port i{display:block;width:10px;height:4px;border-radius:1px;background:#0a2a30}
.port b{display:block;width:28px;height:21px;background:var(--socket);border-radius:2px;border:1px solid #00000066;position:relative;box-shadow:inset 0 2px 3px #000}
.port b::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:5px;background:var(--chassis-2);border-radius:2px 2px 0 0}
.port span{font:9px/1 var(--mono)}
.port[data-s="1"] i{background:var(--led-amber);box-shadow:0 0 6px var(--led-amber)}
.port[data-s="2"] i{background:var(--led-green);box-shadow:0 0 6px var(--led-green)}
.port[data-m] b{border-color:#ff8a7a}
/* blocks */
h2{font:600 13px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;margin:0;color:var(--muted)}
.title{font:700 26px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
@media (max-width:430px){.brand small{display:none}.chip .rk{display:none}.brand{font-size:20px}}
.tile{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:6px;padding:10px 12px}
.tile b{display:block;font:500 24px/1.15 var(--mono);font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:10px 14px;cursor:pointer;font-weight:500;min-height:44px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:14px;min-height:34px}
.btn.ghost{border-color:transparent;color:var(--muted);background:transparent}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.opt[disabled]{opacity:.62}
.opt.right[disabled],.opt.wrong[disabled]{opacity:1}
.action{flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:12px 14px}
.action b{font:600 16px/1.1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.action span{color:var(--muted);font-size:13px;font-weight:400}
input[type=text],input[type=date],input[type=number],select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:10px 12px;min-width:0;min-height:44px}
.empty{color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--mono);padding:4px 7px;border-radius:3px;border:1px solid var(--line);white-space:nowrap}
.pill.good{color:var(--good);border-color:var(--good)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.bar{height:6px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.note{background:var(--accent-soft);border-radius:6px;padding:10px 12px;font-size:14px}
.prose{max-width:66ch;white-space:pre-line}
/* topics */
.domain{display:flex;flex-direction:column;gap:2px}
.dhead{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:baseline;margin-bottom:6px}
.dhead b{font:600 16px/1.2 var(--display);letter-spacing:.05em;text-transform:uppercase}
.dhead .bar{grid-column:1/-1}
.trow{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:11px 4px;border-top:1px dashed var(--line);text-decoration:none;color:var(--ink);border-radius:4px}
.trow:hover{background:var(--accent-soft)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.dot[data-s="1"]{background:var(--led-amber)}
.dot[data-s="2"]{background:var(--led-green)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:10px 6px;min-height:44px;cursor:pointer;font-size:14px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* practice */
.qtext{font-size:17px;font-weight:500;white-space:pre-wrap;margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{justify-content:flex-start;text-align:left;white-space:pre-wrap;width:100%;padding:12px 14px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--panel))}
.opt.wrong{border-color:var(--bad);color:var(--bad)}
.why{color:var(--muted);font-size:15px;margin:0}
.qnav{display:flex;flex-wrap:wrap;gap:4px}
.qnav button{width:32px;height:32px;border:1px solid var(--line);border-radius:4px;background:var(--panel);font:500 11px/1 var(--mono);cursor:pointer;padding:0}
.qnav button.a{background:var(--accent-soft);border-color:var(--accent)}
.qnav button.cur{outline:2px solid var(--accent)}
.qnav button.r{border-color:var(--good);color:var(--good)}
.qnav button.w{border-color:var(--bad);color:var(--bad)}
.flash{perspective:1000px;min-height:220px;cursor:pointer}
.flash .in{position:relative;min-height:220px;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flash.shown .in{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:18px;background:var(--panel);display:flex;flex-direction:column;gap:10px;overflow:auto}
.flash .back{transform:rotateY(180deg);border-left-color:var(--led-green)}
.flash .face p{margin:0;font-size:17px;white-space:pre-wrap}
.term{background:var(--socket);color:#d7eef0;border-radius:6px;padding:12px;font:14px/1.5 var(--mono);display:flex;flex-direction:column;gap:8px}
.term .goal{color:#a9c9ce;font-family:var(--body);font-size:15px}
.term form{display:flex;gap:6px;align-items:center}
.term label{color:var(--led-green);white-space:nowrap}
.term input{flex:1;min-width:0;background:transparent;border:0;color:inherit;font:inherit;padding:4px 0;min-height:auto;border-radius:0}
.term input:focus{outline:0}
.term .ans{color:#a9c9ce}
.term .ok{color:var(--led-green)}
.term .no{color:#ffb4a8}
.subnet{display:grid;grid-template-columns:1fr;gap:10px}
.subnet label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.subnet input{font-family:var(--mono)}
.ring{width:150px;height:150px;margin:0 auto;display:block}
.ring circle{fill:none;stroke-width:10}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke:var(--led-amber);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring text{fill:var(--ink);font:500 26px var(--mono);text-anchor:middle}
.heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;overflow-x:auto}
.heat i{display:block;border-radius:2px;background:var(--line)}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--accent) 35%,var(--line))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--accent) 65%,var(--line))}
.heat i[data-l="3"]{background:var(--accent)}
.heat i.now{outline:1px solid var(--ink);outline-offset:1px}
table.mocks{width:100%;border-collapse:collapse;font-size:14px}
table.mocks td{padding:7px 4px;border-top:1px solid var(--line)}
table.mocks td:last-child{text-align:right}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px -10px #000}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:4px;padding:4px 8px;cursor:pointer}
.burst{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.burst i{position:absolute;width:6px;height:6px;border-radius:1px}
.modal{position:fixed;inset:0;z-index:80;background:#000a;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal .card{max-width:480px;width:100%}
@media (prefers-reduced-motion:no-preference){
  .plate.boot .port i{animation:linkup .5s calc(var(--i)*26ms) backwards}
  .port[data-s="1"] i{animation:blink 1.8s steps(1) infinite}
  .plate.boot .port[data-s="1"] i{animation:linkup .5s calc(var(--i)*26ms) backwards,blink 1.8s steps(1) 1s infinite}
  .plate.boot::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 42%,#ffffff26 50%,transparent 58%);transform:translateX(-100%);animation:sheen 1.4s .15s forwards;pointer-events:none}
  .port.tx i{opacity:.2}
  .enter>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards}
  .enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(5){animation-delay:.2s}.enter>*:nth-child(6){animation-delay:.25s}.enter>*:nth-child(7){animation-delay:.3s}
  .enter .bar i{animation:grow .9s .2s cubic-bezier(.2,.7,.2,1) backwards}
  .btn,.tile,.trow,.port,.chip{transition:transform .15s,border-color .15s,background-color .15s}
  .btn:active,.port:active{transform:scale(.96)}
  .opt.right.just{animation:ok .6s}
  .opt.wrong.just{animation:shake .4s}
  .why.just{animation:rise .35s backwards}
  .qcard.next{animation:slide .35s cubic-bezier(.2,.7,.2,1) backwards}
  .burst i{animation:fly .95s cubic-bezier(.1,.7,.3,1) forwards}
  .toast{animation:rise .3s backwards}
  .chip.timer i{animation:blink 1s steps(1) infinite}
}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes grow{from{width:0}}
@keyframes sheen{to{transform:translateX(100%)}}
@keyframes linkup{from{background:#fff;box-shadow:0 0 10px #fff}}
@keyframes blink{50%{opacity:.35}}
@keyframes ok{40%{transform:scale(1.02)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes slide{from{opacity:0;transform:translateX(24px)}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.flash.noanim .in{transition:none}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">CCNA Rack<small id="sub">200-301 v2.0 · offline</small></div>
    <div class="chips" id="chips"></div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<noscript><p style="padding:16px">CCNA Rack needs JavaScript.</p></noscript>
<script src="bank.js"></script>
<script src="app.js"></script>
</body>
</html>
